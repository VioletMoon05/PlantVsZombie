<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#18260d">
    <meta name="description" content="Chơi Plants vs. Zombies trên trình duyệt.">
    <title>Plants vs. Zombies — Web</title>
    <link rel="icon" href="./icons/favicon.ico">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <style>
      :root {
        color-scheme: dark;
        font-family: "Trebuchet MS", Arial, sans-serif;
        background: #10190c;
        color: #f8f3d9;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(ellipse at 50% 48%, rgba(75, 112, 40, .3), transparent 62%),
          linear-gradient(145deg, #1b2b13, #0b1109 74%);
      }

      /*
       * Ebitengine maps pointer coordinates against the full body viewport and
       * letterboxes the 4:3 game internally. Keep the canvas aligned with that
       * viewport; shrinking/centering it here makes mouse clicks drift.
       */
      canvas {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: auto;
        outline: none;
        touch-action: none;
      }

      #loading {
        position: fixed;
        z-index: 2;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(7, 11, 5, .78);
        text-align: center;
      }

      #loading[hidden] { display: none; }

      .loading-card {
        width: min(100%, 420px);
        padding: 30px 28px 26px;
        border: 1px solid rgba(226, 206, 126, .42);
        border-radius: 18px;
        background: linear-gradient(155deg, rgba(47, 67, 28, .98), rgba(22, 33, 15, .98));
        box-shadow: 0 18px 70px rgba(0, 0, 0, .48), inset 0 1px rgba(255, 255, 255, .08);
      }

      .brand-icon {
        width: 88px;
        height: 88px;
        margin: 0 auto 14px;
        border-radius: 22px;
        object-fit: cover;
      }

      h1 {
        margin: 0;
        color: #f4e9b5;
        font-size: clamp(20px, 5vw, 28px);
        text-shadow: 0 2px 0 #583b15;
      }

      #status {
        margin: 14px 0 7px;
        font-size: 16px;
        font-weight: 700;
      }

      #details {
        margin: 0;
        color: #c6cbb6;
        font-size: 13px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      .spinner {
        width: 34px;
        height: 34px;
        margin: 20px auto 0;
        border: 3px solid rgba(255, 255, 255, .18);
        border-top-color: #d9ca70;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }

      #retry {
        display: none;
        margin-top: 18px;
        padding: 10px 18px;
        border: 1px solid #d8c36c;
        border-radius: 999px;
        background: #526d2d;
        color: #fff8d8;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      #loading.failed #retry { display: inline-block; }
      #loading.failed .spinner { display: none; }

      #rotate-hint {
        display: none;
        position: fixed;
        z-index: 1;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        left: max(12px, env(safe-area-inset-left));
        color: #e2dbbd;
        font-size: 12px;
        text-align: center;
        text-shadow: 0 1px 4px #000;
        pointer-events: none;
      }

      @media (orientation: portrait) {
        #rotate-hint { display: block; }
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
    </style>
  </head>
  <body>
    <section id="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <img class="brand-icon" src="./icons/android-chrome-192x192.png" alt="">
        <h1>Plants vs. Zombies</h1>
        <p id="status">Đang tải trò chơi…</p>
        <p id="details">Lần đầu mở game có thể mất một chút thời gian. Vui lòng giữ trang này mở.</p>
        <div class="spinner" aria-hidden="true"></div>
        <button id="retry" type="button" onclick="location.reload()">Thử tải lại</button>
      </div>
    </section>
    <p id="rotate-hint">Mẹo: xoay thiết bị ngang để có không gian chơi rộng hơn.</p>

    <script src="./wasm_exec.js"></script>
    <script>
      (() => {
        const loading = document.getElementById("loading");
        const status = document.getElementById("status");
        const details = document.getElementById("details");

        async function prepareServiceWorker() {
          if (!("serviceWorker" in navigator) || location.protocol === "file:") return;

          try {
            await navigator.serviceWorker.register("./sw.js");
            await Promise.race([
              navigator.serviceWorker.ready,
              new Promise((resolve) => setTimeout(resolve, 1500))
            ]);

            if (!navigator.serviceWorker.controller) {
              await new Promise((resolve) => {
                let timeout;
                const done = () => {
                  clearTimeout(timeout);
                  resolve();
                };
                navigator.serviceWorker.addEventListener("controllerchange", done, { once: true });
                timeout = setTimeout(done, 500);
                if (navigator.serviceWorker.controller) done();
              });
            }
          } catch (error) {
            console.warn("Không đăng ký được chế độ ứng dụng web:", error);
          }
        }

        function showError(error) {
          console.error("Không thể khởi chạy game WebAssembly:", error);
          loading.classList.add("failed");
          loading.hidden = false;
          status.textContent = "Không thể mở trò chơi.";
          details.textContent = error && error.message
            ? error.message
            : "Hãy chạy game qua máy chủ HTTP/HTTPS và kiểm tra các tệp trong build/web.";
        }

        async function startGame() {
          if (typeof Go !== "function") {
            throw new Error("Không tải được wasm_exec.js. Hãy build lại bản web.");
          }

          const go = new Go();
          await prepareServiceWorker();
          const response = await fetch("./pvz.wasm");
          if (!response.ok) {
            throw new Error(`Không tìm thấy pvz.wasm (HTTP ${response.status}).`);
          }

          let result;
          if (WebAssembly.instantiateStreaming) {
            try {
              result = await WebAssembly.instantiateStreaming(response.clone(), go.importObject);
            } catch (error) {
              // Some static hosts serve .wasm with the wrong MIME type.
              if (!/mime|content.?type/i.test(String(error))) throw error;
              result = await WebAssembly.instantiate(await response.arrayBuffer(), go.importObject);
            }
          } else {
            result = await WebAssembly.instantiate(await response.arrayBuffer(), go.importObject);
          }

          loading.hidden = true;
          go.run(result.instance).catch(showError);
        }

        startGame().catch(showError);
      })();
    </script>
  </body>
</html>
